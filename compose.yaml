services:
  creatorcrate:
    build: .
    container_name: creatorcrate
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: UTC
      APP_NAME: CreatorCrate
      APP_DATA_ROOT: /data/app
      PROJECTS_ROOT: /data/projects
      DATABASE_PATH: /data/app/creatorcrate.db
      # Optional release notifications, forwarded from .env when set.
      RELEASE_NOTIFICATIONS_BASE_URL: ${RELEASE_NOTIFICATIONS_BASE_URL:-}
      RELEASE_NOTIFICATIONS_SMTP_HOST: ${RELEASE_NOTIFICATIONS_SMTP_HOST:-}
      RELEASE_NOTIFICATIONS_SMTP_PORT: ${RELEASE_NOTIFICATIONS_SMTP_PORT:-}
      RELEASE_NOTIFICATIONS_SMTP_SECURITY: ${RELEASE_NOTIFICATIONS_SMTP_SECURITY:-}
      RELEASE_NOTIFICATIONS_SMTP_USERNAME: ${RELEASE_NOTIFICATIONS_SMTP_USERNAME:-}
      RELEASE_NOTIFICATIONS_SMTP_PASSWORD: ${RELEASE_NOTIFICATIONS_SMTP_PASSWORD:-}
      RELEASE_NOTIFICATIONS_SMTP_FROM: ${RELEASE_NOTIFICATIONS_SMTP_FROM:-}
      RELEASE_NOTIFICATIONS_NTFY_URL: ${RELEASE_NOTIFICATIONS_NTFY_URL:-}
      RELEASE_NOTIFICATIONS_NTFY_TOPIC: ${RELEASE_NOTIFICATIONS_NTFY_TOPIC:-}
      RELEASE_NOTIFICATIONS_NTFY_TOKEN: ${RELEASE_NOTIFICATIONS_NTFY_TOKEN:-}
      RELEASE_NOTIFICATIONS_GOTIFY_URL: ${RELEASE_NOTIFICATIONS_GOTIFY_URL:-}
      RELEASE_NOTIFICATIONS_GOTIFY_TOKEN: ${RELEASE_NOTIFICATIONS_GOTIFY_TOKEN:-}
      RELEASE_NOTIFICATIONS_WEBHOOK_URL: ${RELEASE_NOTIFICATIONS_WEBHOOK_URL:-}
      RELEASE_NOTIFICATIONS_WEBHOOK_TOKEN: ${RELEASE_NOTIFICATIONS_WEBHOOK_TOKEN:-}
    volumes:
      - ./data/app:/data/app
      - ./data/projects:/data/projects
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
